<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Template Tools</title>
<link rel="icon" href="favicon.ico">

<style>
:root {
  --bg: #0b0b0f;
  --panel: #16161d;
  --border: #2a2a35;
  --text: #ffffff;
  --muted: #9a9a9a;
  --accent: #7b2cbf;
}

/* ✅ HIDE REAL CURSOR EVERYWHERE */
html, body, * {
  cursor: none !important;
}

/* BASE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* BACKGROUND */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.10) 1px, transparent 1px);
  background-size: 45px 45px;
  opacity: 0.5;
  z-index: 0;
}

.noise {
  position: fixed;
  inset: 0;
  background-image: url("https://www.transparenttextures.com/patterns/noise.png");
  opacity: 0.04;
  z-index: 1;
  pointer-events: none;
}

.spotlight {
  position: fixed;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    circle,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.06),
    rgba(123,44,191,0.05),
    transparent 70%
  );
  transform: translate(-50%, -50%);
  z-index: 1;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  height: 100%;
  width: 240px;
  background: rgba(22,22,29,0.72);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(16px);
  z-index: 5;
  display: flex;
  flex-direction: column;
  transition: width 0.25s ease;
}

.sidebar.collapsed { width: 72px; }

.sidebar-top {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  border-bottom: 1px solid var(--border);
}

.toggle {
  position: absolute;
  left: 10px;
  width: 34px;
  height: 34px;
  background: #15151c;
  border: 1px solid var(--border);
  color: white;
  border-radius: 8px;
}

/* tools */
.sidebar-tools {
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 6px;
}

.sidebar-tools button {
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
}

/* MAIN */
.container {
  margin-left: 260px;
  padding: 30px 20px;
  max-width: 900px;
  position: relative;
  z-index: 2;
}

.sidebar.collapsed ~ .container {
  margin-left: 90px;
}

textarea {
  width: 100%;
  height: 200px;
  background: rgba(22,22,29,0.9);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
}

.output-box {
  margin-top: 10px;
  background: rgba(22,22,29,0.85);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  min-height: 90px;
  white-space: pre-wrap;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.small-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  background: #15151c;
  border: 1px solid var(--border);
  color: white;
}

/* ================= PARTICLES ================= */

.particle {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  background: #000;
  opacity: 0.95;
  animation: disperse 900ms ease-out forwards;
}

@keyframes disperse {
  0% {
    opacity: 1;
    transform: translate(0,0) scale(1) rotate(0deg);
  }
  100% {
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(0.2) rotate(var(--r));
  }
}

.circle { border-radius: 50%; }
.square { border-radius: 2px; }
.sketch {
  background: transparent;
  border: 2px solid #000;
}

/* ================= CURSOR ================= */

.cursor-dot {
  position: fixed;
  width: 8px;
  height: 8px;
  background: #000;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
}

.cursor-ring {
  position: fixed;
  width: 28px;
  height: 28px;
  border: 2px solid rgba(0,0,0,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
}

</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="spotlight" id="spot"></div>
<div class="noise"></div>

<!-- CURSOR -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <div class="sidebar-top">
    <button class="toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-title">TOOLS</div>
  </div>

  <div class="sidebar-tools">
    <button onclick="setTool('extract')">URL Extract</button>
    <button onclick="setTool('b64enc')">Base64 Encode</button>
    <button onclick="setTool('b64dec')">Base64 Decode</button>
    <button onclick="setTool('count')">Counter</button>
    <button onclick="setTool('json')">JSON</button>
    <button onclick="setTool('html')">HTML</button>
    <button onclick="setTool('uuid')">UUID</button>
    <button onclick="setTool('reverse')">Reverse</button>
  </div>

</div>

<!-- MAIN -->
<div class="container">

  <textarea id="input"></textarea>
  <div class="output-box" id="output"></div>

  <div class="actions">
    <button class="small-btn" onclick="runTool()">Run</button>
    <button class="small-btn" onclick="clearAll()">Clear</button>
    <button class="small-btn" onclick="copyOutput()">Copy</button>
  </div>

</div>

<script>

let tool = "extract";

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
}

function setTool(t) {
  tool = t;
}

/* ================= PARTICLES ================= */

const shapes = ["circle", "square", "sketch"];

document.addEventListener("click", (e) => {
  spawnParticles(e.clientX, e.clientY);
});

function spawnParticles(x, y) {
  for (let i = 0; i < 20; i++) {
    const p = document.createElement("div");

    const type = shapes[Math.floor(Math.random() * shapes.length)];
    const size = Math.random() * 10 + 6;

    p.classList.add("particle", type);
    p.style.width = size + "px";
    p.style.height = size + "px";

    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 140 + 20;

    p.style.setProperty("--x", Math.cos(angle) * dist + "px");
    p.style.setProperty("--y", Math.sin(angle) * dist + "px");
    p.style.setProperty("--r", Math.random() * 360 + "deg");

    p.style.left = x + "px";
    p.style.top = y + "px";

    document.body.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

/* ================= CURSOR ================= */

const dot = document.getElementById("cursorDot");
const ring = document.getElementById("cursorRing");

let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener("mousemove", (e) => {
  mx = e.clientX;
  my = e.clientY;

  dot.style.left = mx + "px";
  dot.style.top = my + "px";
});

function animateCursor() {
  rx += (mx - rx) * 0.15;
  ry += (my - ry) * 0.15;

  ring.style.left = rx + "px";
  ring.style.top = ry + "px";

  requestAnimationFrame(animateCursor);
}
animateCursor();

/* TOOL LOGIC */

function runTool() {
  const input = document.getElementById("input").value;
  let out = "";

  if (tool === "extract") {
    const links = input.match(/https?:\/\/[^\s]+/g) || [];
    out = links.length ? links.join("\n") : "No links found.";
  }

  if (tool === "b64enc") out = btoa(input || "");

  if (tool === "b64dec") {
    try { out = atob(input); }
    catch { out = "Invalid Base64"; }
  }

  if (tool === "count") {
    const words = input.trim() ? input.trim().split(/\s+/).length : 0;
    out = `Characters: ${input.length}\nWords: ${words}`;
  }

  if (tool === "json") {
    try { out = JSON.stringify(JSON.parse(input), null, 2); }
    catch { out = "Invalid JSON"; }
  }

  if (tool === "html") {
    const w = window.open();
    w.document.write(input);
    return;
  }

  if (tool === "uuid") {
    out = crypto.randomUUID();
  }

  if (tool === "reverse") {
    out = input.split(/\s+/).reverse().join(" ");
  }

  document.getElementById("output").textContent = out;
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").textContent = "";
}

function copyOutput() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
}

/* spotlight */
const spot = document.getElementById("spot");
let smx = 0, smy = 0;

document.addEventListener("mousemove", (e) => {
  smx = e.clientX;
  smy = e.clientY;
});

function animate() {
  const dx = smx - spot.offsetLeft;
  const dy = smy - spot.offsetTop;

  spot.style.left = spot.offsetLeft + dx * 0.12 + "px";
  spot.style.top = spot.offsetTop + dy * 0.12 + "px";

  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
