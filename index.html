<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tool Dashboard</title>

<style>
:root {
  --bg: #0b0b0f;
  --panel: #16161d;
  --card: #1c1c25;
  --border: #2a2a35;
  --text: #ffffff;
  --muted: #9a9a9a;
  --accent: #7b2cbf;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 40px 15px;
}

.container {
  width: 100%;
  max-width: 900px;
}

.header {
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 26px;
}

.header p {
  color: var(--muted);
  margin-top: 5px;
}

/* INPUTS */
textarea {
  width: 100%;
  height: 180px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  outline: none;
  font-size: 14px;
  resize: vertical;
}

/* GRID CARDS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 15px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
  transition: 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(123, 44, 191, 0.25);
}

.card-title {
  font-weight: bold;
  font-size: 15px;
}

.card-desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* OUTPUT */
.output-box {
  margin-top: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  min-height: 90px;
  white-space: pre-wrap;
}

/* ACTION BUTTONS */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.small-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  background: #15151c;
  border: 1px solid var(--border);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.small-btn:hover {
  border-color: var(--accent);
}

/* TOOL LABEL */
.tool-label {
  margin-top: 10px;
  font-size: 13px;
  color: var(--muted);
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Tool Dashboard</h1>
    <p>Multiple utilities powered by simple JavaScript tools</p>
  </div>

  <textarea id="input" placeholder="Enter text..."></textarea>

  <div class="grid">

    <div class="card" onclick="setTool('extract')">
      <div class="card-title">Extract Links</div>
      <div class="card-desc">Find URLs in text</div>
    </div>

    <div class="card" onclick="setTool('base64')">
      <div class="card-title">Base64 Encode</div>
      <div class="card-desc">Convert text to Base64</div>
    </div>

    <div class="card" onclick="setTool('count')">
      <div class="card-title">Text Counter</div>
      <div class="card-desc">Count words and characters</div>
    </div>

  </div>

  <div class="tool-label" id="toolLabel">Selected tool: Extract Links</div>

  <div class="output-box" id="output"></div>

  <div class="actions">
    <button class="small-btn" onclick="runTool()">Run</button>
    <button class="small-btn" onclick="clearAll()">Clear</button>
    <button class="small-btn" onclick="copyOutput()">Copy</button>
  </div>

</div>

<script>

let currentTool = "extract";

/* SWITCH TOOL */
function setTool(tool) {
  currentTool = tool;

  const label = {
    extract: "Extract Links",
    base64: "Base64 Encode",
    count: "Text Counter"
  };

  document.getElementById("toolLabel").textContent =
    "Selected tool: " + label[tool];
}

/* RUN TOOL */
function runTool() {
  const text = document.getElementById("input").value;
  let result = "";

  if (currentTool === "extract") {
    const links = text.match(/https?:\/\/[^\s]+/g) || [];
    result = links.length ? links.join("\n") : "No links found.";
  }

  if (currentTool === "base64") {
    result = btoa(text || "");
  }

  if (currentTool === "count") {
    const chars = text.length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    result = `Characters: ${chars}\nWords: ${words}`;
  }

  document.getElementById("output").textContent = result;
}

/* CLEAR */
function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").textContent = "";
}

/* COPY */
function copyOutput() {
  const text = document.getElementById("output").textContent;
  navigator.clipboard.writeText(text);
}

</script>

</body>
</html>
