<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="icon" href="favicon.ico">
<title>Tool UI + Animations</title>

<style>
:root {
  --bg:#0b0b0f;
  --border:#2a2a35;
  --text:#fff;
}

body {
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* ================= BACKGROUND SYSTEM ================= */
.layer {
  position:fixed;
  inset:0;
  pointer-events:none;
}

/* GRID (moving) */
#grid {
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.10) 1px, transparent 1px);
  background-size:45px 45px;
  animation: gridMove 6s linear infinite;
  opacity:0.5;
}

@keyframes gridMove {
  from { background-position: 0 0; }
  to { background-position: 200px -200px; }
}

/* RAIN */
.rain {
  position:absolute;
  width:2px;
  height:60px;
  background:rgba(255,255,255,0.15);
  animation: fall linear infinite;
}

@keyframes fall {
  from { transform: translateY(-120vh); }
  to { transform: translateY(120vh); }
}

/* PARTICLES */
.particle {
  position:absolute;
  width:4px;
  height:4px;
  background:rgba(255,255,255,0.35);
  border-radius:50%;
  animation: float 6s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* ================= RIGHT CONTROL PANEL ================= */
.rightPanel {
  position:fixed;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:140px;
  background:rgba(22,22,29,0.7);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  z-index:10;
}

.rightPanel button {
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#15151c;
  border:1px solid var(--border);
  color:#fff;
  border-radius:8px;
}

/* ================= SIDEBAR ================= */
.sidebar {
  position:fixed;
  left:-240px;
  top:0;
  width:240px;
  height:100%;
  background:rgba(22,22,29,0.75);
  border-right:1px solid var(--border);
  backdrop-filter:blur(12px);
  transition:left 0.25s ease;
  z-index:1000;
  pointer-events:none;
}

.sidebar.open {
  left:0;
  pointer-events:auto;
}

/* TAB */
.tab {
  position:absolute;
  right:-40px;
  top:120px;
  width:40px;
  height:90px;
  background:rgba(22,22,29,0.9);
  border:1px solid var(--border);
  border-left:none;
  border-radius:0 10px 10px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:1001;
  pointer-events:auto;
}

/* buttons */
.sidebar button {
  width:100%;
  padding:10px;
  background:transparent;
  border:none;
  color:#fff;
  text-align:left;
}

/* ================= MAIN ================= */
.container {
  margin-left:40px;
  padding:20px;
  max-width:900px;
  position:relative;
  z-index:2;
}

/* panels */
.panel {
  display:none;
  opacity:0;
  transform:translateY(10px) scale(0.98);
}

.panel.active {
  display:block;
  animation:pop 0.25s ease forwards;
}

@keyframes pop {
  from {
    opacity:0;
    transform:translateY(12px) scale(0.97);
  }
  to {
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* inputs */
textarea,input {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(22,22,29,0.85);
  color:#fff;
}

/* output */
.output {
  margin-top:10px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  min-height:70px;
}

/* ================= CURSOR ================= */
.cursor-dot {
  position:fixed;
  width:8px;
  height:8px;
  background:#cfcfcf;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9999;
}

.cursor-ring {
  position:fixed;
  width:28px;
  height:28px;
  border:2px solid rgba(200,200,200,0.4);
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9998;
}

</style>
</head>

<body>

<!-- BACKGROUNDS -->
<div id="grid" class="layer"></div>
<div id="rainLayer" class="layer"></div>
<div id="particleLayer" class="layer"></div>

<!-- RIGHT PANEL (BACKGROUND SWITCHER) -->
<div class="rightPanel">
  <button onclick="setBG('grid')">Grid</button>
  <button onclick="setBG('rain')">Rain</button>
  <button onclick="setBG('particles')">Particles</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="tab" onclick="toggleSidebar()">☰</div>

  <button onclick="setTool('extract')">URL Extract</button>
  <button onclick="setTool('b64')">Base64</button>
  <button onclick="setTool('url')">URL Encode</button>
  <button onclick="setTool('caesar')">Caesar Cipher</button>
  <button onclick="setTool('reverse')">Reverse</button>
  <button onclick="setTool('browser')">Browser</button>
</div>

<!-- MAIN -->
<div class="container">

  <div class="panel" id="extract">
    <textarea id="input"></textarea>
    <div class="output" id="out"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="b64">
    <textarea id="b64in"></textarea>
    <div class="output" id="b64out"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="url">
    <textarea id="uin"></textarea>
    <div class="output" id="uout"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="caesar">
    <textarea id="cin"></textarea>
    <input id="shift" type="number"/>
    <div class="output" id="cout"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="reverse">
    <textarea id="rin"></textarea>
    <div class="output" id="rout"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="browser">
    <textarea id="urlin"></textarea>
    <iframe id="frame" style="width:100%;height:400px;border:1px solid #333;margin-top:10px;"></iframe>
    <div class="output" id="bstat"></div>
    <button onclick="run()">Load</button>
  </div>

</div>

<!-- CURSOR -->
<div class="cursor-dot" id="dot"></div>
<div class="cursor-ring" id="ring"></div>

<script>

let tool="extract";
let bgMode="grid";

/* SIDEBAR */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

/* TOOL SWITCH */
function setTool(t){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  setTimeout(()=>{
    document.getElementById(t).classList.add("active");
  },40);
  tool=t;
}

setTool("extract");

/* BACKGROUND SWITCH */
function setBG(mode){
  bgMode=mode;

  document.getElementById("grid").style.display="none";
  document.getElementById("rainLayer").innerHTML="";
  document.getElementById("particleLayer").innerHTML="";

  if(mode==="grid"){
    document.getElementById("grid").style.display="block";
  }

  if(mode==="rain"){
    setInterval(()=>{
      if(bgMode!=="rain")return;
      const d=document.createElement("div");
      d.className="rain";
      d.style.left=Math.random()*window.innerWidth+"px";
      d.style.animationDuration=(0.6+Math.random())+"s";
      document.getElementById("rainLayer").appendChild(d);
      setTimeout(()=>d.remove(),2000);
    },60);
  }

  if(mode==="particles"){
    setInterval(()=>{
      if(bgMode!=="particles")return;
      const p=document.createElement("div");
      p.className="particle";
      p.style.left=Math.random()*window.innerWidth+"px";
      p.style.top=Math.random()*window.innerHeight+"px";
      document.getElementById("particleLayer").appendChild(p);
      setTimeout(()=>p.remove(),5000);
    },120);
  }
}

/* RUN */
function run(){

  if(tool==="extract"){
    const v=document.getElementById("input").value;
    const links=v.match(/https?:\/\/[^\s]+/g)||[];
    document.getElementById("out").textContent=links.join("\n")||"No links";
  }

  if(tool==="b64"){
    const v=document.getElementById("b64in").value;
    try{document.getElementById("b64out").textContent=atob(v);}
    catch{document.getElementById("b64out").textContent=btoa(v);}
  }

  if(tool==="url"){
    const v=document.getElementById("uin").value;
    try{document.getElementById("uout").textContent=decodeURIComponent(v);}
    catch{document.getElementById("uout").textContent=encodeURIComponent(v);}
  }

  if(tool==="caesar"){
    const s=parseInt(document.getElementById("shift").value||0);
    const v=document.getElementById("cin").value;
    document.getElementById("cout").textContent=
      v.replace(/[a-z]/gi,c=>{
        const base=c>='a'?97:65;
        return String.fromCharCode((c.charCodeAt(0)-base+s+26)%26+base);
      });
  }

  if(tool==="reverse"){
    const v=document.getElementById("rin").value;
    document.getElementById("rout").textContent=
      v.split(/\s+/).reverse().join(" ");
  }

  if(tool==="browser"){
    let url=document.getElementById("urlin").value;
    if(!/^https?:\/\//i.test(url)) url="https://"+url;
    document.getElementById("frame").src=url;
    document.getElementById("bstat").textContent=url;
  }
}

/* CURSOR */
const dot=document.getElementById("dot");
const ring=document.getElementById("ring");

let mx=0,my=0;

document.addEventListener("mousemove",e=>{
  mx=e.clientX;
  my=e.clientY;

  dot.style.left=mx+"px";
  dot.style.top=my+"px";
});

function animate(){
  let rx=parseFloat(ring.style.left)||0;
  let ry=parseFloat(ring.style.top)||0;

  ring.style.left=rx+(mx-rx)*0.18+"px";
  ring.style.top=ry+(my-ry)*0.18+"px";

  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
