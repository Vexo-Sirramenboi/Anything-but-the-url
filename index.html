<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Template Tools</title>

<style>
:root {
  --bg: #0b0b0f;
  --border: #2a2a35;
  --text: #ffffff;
}

html, body, * {
  cursor: none !important;
}

body {
  margin: 0;
  font-family: Arial;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ================= BACKGROUNDS ================= */
#grid, #rain, #particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* GRID */
#grid {
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.10) 1px, transparent 1px);
  background-size: 45px 45px;
  opacity: 0.5;
  animation: gridMove 6s linear infinite;
}

@keyframes gridMove {
  from { background-position: 0 0; }
  to { background-position: 240px -240px; }
}

/* RAIN */
.rain-drop {
  position: absolute;
  width: 2px;
  height: 60px;
  background: rgba(255,255,255,0.15);
  animation: fall linear infinite;
}

@keyframes fall {
  from { transform: translateY(-120vh); }
  to { transform: translateY(120vh); }
}

/* PARTICLES */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(255,255,255,0.35);
  border-radius: 50%;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* ================= RIGHT MENU ================= */
.menu {
  position: fixed;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 140px;
  background: rgba(22,22,29,0.7);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  z-index: 10;
}

.menu button {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
  background: #15151c;
  border: 1px solid var(--border);
  color: white;
  border-radius: 8px;
}

/* ================= SIDEBAR ================= */
.sidebar {
  position: fixed;
  left: -240px;
  top: 0;
  width: 240px;
  height: 100%;
  background: rgba(22,22,29,0.75);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(16px);
  transition: left 0.3s ease;
  z-index: 5;
}

.sidebar.open { left: 0; }

.sidebar-tab {
  position: absolute;
  right: -40px;
  top: 120px;
  width: 40px;
  height: 90px;
  background: rgba(22,22,29,0.9);
  border: 1px solid var(--border);
  border-left: none;
  border-radius: 0 10px 10px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.sidebar-tools {
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 6px;
}

.sidebar-tools button {
  padding: 10px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  text-align: left;
  border-radius: 10px;
}

.sidebar-tools button:hover {
  background: rgba(255,255,255,0.05);
}

/* ================= MAIN ================= */
.container {
  margin-left: 40px;
  padding: 30px;
  max-width: 900px;
  position: relative;
  z-index: 2;
}

/* panels */
.panel {
  display: none;
}

.panel.active {
  display: block;
}

/* inputs */
textarea, input {
  width: 100%;
  margin-top: 10px;
  background: rgba(22,22,29,0.85);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}

/* output */
.output {
  margin-top: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 80px;
  white-space: pre-wrap;
}

/* cursor */
.cursor {
  position: fixed;
  width: 10px;
  height: 10px;
  background: #b5b5b5;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}

</style>
</head>

<body>

<!-- BACKGROUNDS -->
<div id="grid"></div>
<div id="rain"></div>
<div id="particles"></div>

<!-- RIGHT MENU -->
<div class="menu">
  <button onclick="setBG('grid')">Grid</button>
  <button onclick="setBG('rain')">Rain</button>
  <button onclick="setBG('particles')">Particles</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-tab" onclick="toggleSidebar()">☰</div>

  <div class="sidebar-tools">
    <button onclick="setTool('extract')">URL Extract</button>
    <button onclick="setTool('b64')">Base64</button>
    <button onclick="setTool('url')">URL Encode</button>
    <button onclick="setTool('caesar')">Caesar</button>
    <button onclick="setTool('reverse')">Reverse</button>
    <button onclick="setTool('browser')">Browser</button>
  </div>
</div>

<!-- MAIN -->
<div class="container">

  <div class="panel" id="extract">
    <textarea id="input"></textarea>
    <div class="output" id="out1"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="b64">
    <textarea id="binput"></textarea>
    <div class="output" id="bout"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="url">
    <textarea id="uinput"></textarea>
    <div class="output" id="uout"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="caesar">
    <textarea id="cinput"></textarea>
    <input id="shift" type="number" />
    <div class="output" id="cout"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="reverse">
    <textarea id="rinput"></textarea>
    <div class="output" id="rout"></div>
    <button onclick="run()">Run</button>
  </div>

  <div class="panel" id="browser">
    <textarea id="burl"></textarea>
    <iframe id="frame" style="width:100%;height:400px;border:1px solid #333;margin-top:10px;"></iframe>
    <div class="output" id="bstatus"></div>
    <button onclick="run()">Load</button>
  </div>

</div>

<!-- CURSOR -->
<div class="cursor" id="cursor"></div>

<script>

let tool = "extract";
let bgMode = "grid";

/* TOOL SWITCH */
function setTool(t){
  tool = t;
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(t).classList.add("active");
}
setTool("extract");

/* BACKGROUND SWITCH */
function setBG(mode){
  bgMode = mode;
  document.getElementById("grid").style.display = "none";
  document.getElementById("rain").style.display = "none";
  document.getElementById("particles").style.display = "none";

  if(mode === "grid") document.getElementById("grid").style.display = "block";
  if(mode === "rain") document.getElementById("rain").style.display = "block";
  if(mode === "particles") document.getElementById("particles").style.display = "block";
}
setBG("grid");

/* SIDEBAR */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

/* RUN TOOLS */
function run(){

  if(tool === "extract"){
    const v = document.getElementById("input").value;
    const links = v.match(/https?:\/\/[^\s]+/g) || [];
    document.getElementById("out1").textContent = links.join("\n") || "No links";
  }

  if(tool === "b64"){
    const v = document.getElementById("binput").value;
    try { document.getElementById("bout").textContent = atob(v); }
    catch { document.getElementById("bout").textContent = btoa(v); }
  }

  if(tool === "url"){
    const v = document.getElementById("uinput").value;
    try { document.getElementById("uout").textContent = decodeURIComponent(v); }
    catch { document.getElementById("uout").textContent = encodeURIComponent(v); }
  }

  if(tool === "caesar"){
    const s = parseInt(document.getElementById("shift").value||0);
    const v = document.getElementById("cinput").value;
    document.getElementById("cout").textContent =
      v.replace(/[a-z]/gi, c=>{
        const base = c>='a'?97:65;
        return String.fromCharCode((c.charCodeAt(0)-base+s+26)%26+base);
      });
  }

  if(tool === "reverse"){
    const v = document.getElementById("rinput").value;
    document.getElementById("rout").textContent =
      v.split(/\s+/).reverse().join(" ");
  }

  if(tool === "browser"){
    let url = document.getElementById("burl").value;
    if(!/^https?:\/\//i.test(url)) url="https://"+url;
    document.getElementById("frame").src = url;
    document.getElementById("bstatus").textContent = url;
  }
}

/* CURSOR */
const cursor = document.getElementById("cursor");

document.addEventListener("mousemove", e=>{
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

/* RAIN */
setInterval(()=>{
  if(bgMode !== "rain") return;
  const d = document.createElement("div");
  d.className = "rain-drop";
  d.style.left = Math.random()*window.innerWidth+"px";
  d.style.animationDuration = (0.5+Math.random())+"s";
  document.getElementById("rain").appendChild(d);
  setTimeout(()=>d.remove(),2000);
},50);

/* PARTICLES */
setInterval(()=>{
  if(bgMode !== "particles") return;
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random()*window.innerWidth+"px";
  p.style.top = Math.random()*window.innerHeight+"px";
  document.getElementById("particles").appendChild(p);
  setTimeout(()=>p.remove(),6000);
},120);

</script>

</body>
</html>
