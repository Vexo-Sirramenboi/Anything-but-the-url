<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Template Tools</title>

<!-- FAVICON -->
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico">

<style>
:root {
  --bg: #0b0b0f;
  --panel: #16161d;
  --card: #1c1c25;
  --border: #2a2a35;
  --text: #ffffff;
  --muted: #9a9a9a;
  --accent: #7b2cbf;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 40px 15px;
}

.container {
  width: 100%;
  max-width: 900px;
}

.header h1 {
  margin: 0;
  font-size: 26px;
}

.header p {
  color: var(--muted);
  margin-top: 5px;
}

/* INPUT */
textarea {
  width: 100%;
  height: 180px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  resize: vertical;
  outline: none;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 15px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(123, 44, 191, 0.25);
}

.card-title {
  font-weight: bold;
  font-size: 15px;
}

.card-desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* OUTPUT */
.output-box {
  margin-top: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  min-height: 90px;
  white-space: pre-wrap;
}

/* HTML PREVIEW */
iframe {
  width: 100%;
  height: 300px;
  margin-top: 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  display: none;
  background: white;
}

/* ACTIONS */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.small-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  background: #15151c;
  border: 1px solid var(--border);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.small-btn:hover {
  border-color: var(--accent);
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Template Tools</h1>
    <p>Multi-purpose web utility dashboard</p>
  </div>

  <textarea id="input" placeholder="Enter text, JSON, or HTML..."></textarea>

  <div class="grid">

    <div class="card" onclick="setTool('extract')">
      <div class="card-title">URL Extractor</div>
      <div class="card-desc">Find links in text</div>
    </div>

    <div class="card" onclick="setTool('b64enc')">
      <div class="card-title">Base64 Encode</div>
      <div class="card-desc">Text → Base64</div>
    </div>

    <div class="card" onclick="setTool('b64dec')">
      <div class="card-title">Base64 Decode</div>
      <div class="card-desc">Base64 → Text</div>
    </div>

    <div class="card" onclick="setTool('count')">
      <div class="card-title">Text Counter</div>
      <div class="card-desc">Words & characters</div>
    </div>

    <div class="card" onclick="setTool('json')">
      <div class="card-title">JSON Runner</div>
      <div class="card-desc">Validate & format JSON</div>
    </div>

    <div class="card" onclick="setTool('html')">
      <div class="card-title">HTML Runner</div>
      <div class="card-desc">Live HTML preview</div>
    </div>

  </div>

  <div class="output-box" id="output"></div>

  <iframe id="preview"></iframe>

  <div class="actions">
    <button class="small-btn" onclick="runTool()">Run</button>
    <button class="small-btn" onclick="clearAll()">Clear</button>
    <button class="small-btn" onclick="copyOutput()">Copy</button>
  </div>

</div>

<script>

let tool = "extract";

function setTool(t) {
  tool = t;
  document.getElementById("preview").style.display = "none";
}

function runTool() {

  const input = document.getElementById("input").value;
  const output = document.getElementById("output");
  const preview = document.getElementById("preview");

  preview.style.display = "none";

  let result = "";

  if (tool === "extract") {
    const links = input.match(/https?:\/\/[^\s]+/g) || [];
    result = links.length ? links.join("\n") : "No links found.";
  }

  if (tool === "b64enc") {
    result = btoa(input || "");
  }

  if (tool === "b64dec") {
    try {
      result = atob(input);
    } catch {
      result = "Invalid Base64 string.";
    }
  }

  if (tool === "count") {
    const chars = input.length;
    const words = input.trim() ? input.trim().split(/\s+/).length : 0;
    result = `Characters: ${chars}\nWords: ${words}`;
  }

  if (tool === "json") {
    try {
      result = JSON.stringify(JSON.parse(input), null, 2);
    } catch (e) {
      result = "Invalid JSON:\n" + e.message;
    }
  }

  if (tool === "html") {
    output.textContent = "HTML preview running below.";
    preview.style.display = "block";
    preview.srcdoc = input;
    return;
  }

  output.textContent = result;
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").textContent = "";
  document.getElementById("preview").style.display = "none";
}

function copyOutput() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
}

</script>

</body>
</html>
