<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <title>TEMPLATE TOOLS</title>
  <title>Extract Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 220px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
      padding: 10px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 20px;
      background: purple;
      color: white;
      border: none;
      cursor: pointer;
    }

    pre {
      margin-top: 20px;
      background: #1e1e1e;
      padding: 15px;
      white-space: pre-wrap;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

  <h2>Extract Only Links</h2>

  <textarea id="input">

  </textarea>

  <button onclick="extractLinks()">Extract</button>

  <pre id="output"></pre>

  <script>
    function extractLinks() {
      const text = document.getElementById("input").value;

      // Match all URLs
      const links = text.match(/https?:\/\/[^\s]+/g) || [];

      document.getElementById("output").textContent = links.join("\n");
    }
  </script>

</body>
</html>
