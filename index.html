<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Template Tools</title>
<link rel="icon" href="favicon.ico">

<style>
:root {
  --bg: #0b0b0f;
  --panel: #16161d;
  --card: #1c1c25;
  --border: #2a2a35;
  --text: #ffffff;
  --muted: #9a9a9a;
  --accent: #7b2cbf;
}

/* BASE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* BACKGROUND */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.10) 1px, transparent 1px);
  background-size: 45px 45px;
  opacity: 0.5;
  z-index: 0;
}

.noise {
  position: fixed;
  inset: 0;
  background-image: url("https://www.transparenttextures.com/patterns/noise.png");
  opacity: 0.04;
  z-index: 1;
  pointer-events: none;
}

.spotlight {
  position: fixed;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    circle,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.06),
    rgba(123,44,191,0.05),
    transparent 70%
  );
  transform: translate(-50%, -50%);
  z-index: 1;
}

/* ================= SIDEBAR ================= */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  height: 100%;
  width: 240px;
  background: rgba(22,22,29,0.7);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(14px);
  z-index: 5;

  display: flex;
  flex-direction: column;

  transition: width 0.25s ease;
}

/* collapsed */
.sidebar.collapsed {
  width: 72px;
}

/* TOP BAR FIXED ALIGNMENT */
.sidebar-top {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

/* TITLE centered */
.sidebar-title {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--muted);
  transition: opacity 0.2s ease;
}

.sidebar.collapsed .sidebar-title {
  opacity: 0;
}

/* FIX: hamburger pinned LEFT */
.toggle {
  position: absolute;
  left: 8px;
  width: 34px;
  height: 34px;
  background: #15151c;
  border: 1px solid var(--border);
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

/* tools */
.sidebar-tools {
  display: flex;
  flex-direction: column;
  padding: 8px;
  gap: 4px;
}

.sidebar-tools button {
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  transition: 0.15s ease;
}

.sidebar-tools button:hover {
  background: rgba(255,255,255,0.04);
}

.sidebar-tools button.active {
  border-left: 3px solid var(--accent);
  background: rgba(123,44,191,0.12);
  padding-left: 9px;
}

/* collapsed */
.sidebar.collapsed .sidebar-tools button {
  text-align: center;
  font-size: 11px;
  padding: 10px 0;
}

/* MAIN */
.container {
  margin-left: 260px;
  padding: 25px 20px;
  max-width: 900px;
  position: relative;
  z-index: 2;
  transition: margin-left 0.25s ease;
}

.sidebar.collapsed ~ .container {
  margin-left: 90px;
}

textarea {
  width: 100%;
  height: 200px;
  background: rgba(22,22,29,0.85);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  resize: vertical;
  outline: none;
}

.output-box {
  margin-top: 15px;
  background: rgba(22,22,29,0.75);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  min-height: 90px;
  white-space: pre-wrap;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.small-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  background: #15151c;
  border: 1px solid var(--border);
  color: white;
  cursor: pointer;
}

.small-btn:hover {
  border-color: var(--accent);
}

</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="spotlight" id="spot"></div>
<div class="noise"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <div class="sidebar-top">
    <button class="toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-title">TOOLS</div>
  </div>

  <div class="sidebar-tools">
    <button onclick="setTool('extract')">URL Extract</button>
    <button onclick="setTool('b64enc')">Base64 Encode</button>
    <button onclick="setTool('b64dec')">Base64 Decode</button>
    <button onclick="setTool('count')">Counter</button>
    <button onclick="setTool('json')">JSON</button>
    <button onclick="setTool('html')">HTML</button>
    <button onclick="setTool('uuid')">UUID</button>
    <button onclick="setTool('reverse')">Reverse</button>
  </div>

</div>

<!-- MAIN -->
<div class="container">

  <textarea id="input"></textarea>
  <div class="output-box" id="output"></div>

  <div class="actions">
    <button class="small-btn" onclick="runTool()">Run</button>
    <button class="small-btn" onclick="clearAll()">Clear</button>
    <button class="small-btn" onclick="copyOutput()">Copy</button>
  </div>

</div>

<script>

let tool = "extract";

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
}

function setTool(t) {
  tool = t;

  document.querySelectorAll(".sidebar-tools button")
    .forEach(b => b.classList.remove("active"));

  event.target.classList.add("active");
}

function runTool() {
  const input = document.getElementById("input").value;
  let out = "";

  if (tool === "extract") {
    const links = input.match(/https?:\/\/[^\s]+/g) || [];
    out = links.length ? links.join("\n") : "No links found.";
  }

  if (tool === "b64enc") out = btoa(input || "");

  if (tool === "b64dec") {
    try { out = atob(input); }
    catch { out = "Invalid Base64"; }
  }

  if (tool === "count") {
    const words = input.trim() ? input.trim().split(/\s+/).length : 0;
    out = `Characters: ${input.length}\nWords: ${words}`;
  }

  if (tool === "json") {
    try { out = JSON.stringify(JSON.parse(input), null, 2); }
    catch { out = "Invalid JSON"; }
  }

  if (tool === "html") {
    const w = window.open();
    w.document.write(input);
    return;
  }

  if (tool === "uuid") {
    out = crypto.randomUUID ? crypto.randomUUID() :
      "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random()*16|0;
        const v = c==='x'?r:(r&0x3|0x8);
        return v.toString(16);
      });
  }

  if (tool === "reverse") {
    out = input.split(/\s+/).filter(Boolean).reverse().join(" ");
  }

  document.getElementById("output").textContent = out;
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").textContent = "";
}

function copyOutput() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
}

/* spotlight */
const spot = document.getElementById("spot");
let mx = 0, my = 0;

document.addEventListener("mousemove", (e) => {
  mx = e.clientX;
  my = e.clientY;
});

function animate() {
  const dx = mx - spot.offsetLeft;
  const dy = my - spot.offsetTop;

  spot.style.left = spot.offsetLeft + dx * 0.12 + "px";
  spot.style.top = spot.offsetTop + dy * 0.12 + "px";

  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
