<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Template Tools</title>
<link rel="icon" href="favicon.ico">

<style>
:root {
  --bg: #0b0b0f;
  --panel: #16161d;
  --border: #2a2a35;
  --text: #ffffff;
  --muted: #9a9a9a;
  --accent: #7b2cbf;
}

/* hide real cursor */
html, body, * {
  cursor: none !important;
}

/* BASE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* BACKGROUND */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.10) 1px, transparent 1px);
  background-size: 45px 45px;
  opacity: 0.5;
  z-index: 0;
}

.noise {
  position: fixed;
  inset: 0;
  background-image: url("https://www.transparenttextures.com/patterns/noise.png");
  opacity: 0.04;
  z-index: 1;
  pointer-events: none;
}

.spotlight {
  position: fixed;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    circle,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.06),
    rgba(123,44,191,0.05),
    transparent 70%
  );
  transform: translate(-50%, -50%);
  z-index: 1;
}

/* ================= SIDEBAR SLIDE ================= */

.sidebar {
  position: fixed;
  left: -240px; /* hidden */
  top: 0;
  height: 100%;
  width: 240px;
  background: rgba(22,22,29,0.75);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(16px);
  z-index: 5;
  display: flex;
  flex-direction: column;
  transition: left 0.3s ease;
}

.sidebar.open {
  left: 0;
}

/* TAB BUTTON */
.sidebar-tab {
  position: absolute;
  right: -40px;
  top: 120px;
  width: 40px;
  height: 90px;
  background: rgba(22,22,29,0.9);
  border: 1px solid var(--border);
  border-left: none;
  border-radius: 0 10px 10px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}

.sidebar-tools {
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 6px;
}

.sidebar-tools button {
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
}

.sidebar-tools button:hover {
  background: rgba(255,255,255,0.05);
}

/* MAIN */
.container {
  margin-left: 40px;
  padding: 30px 20px;
  max-width: 900px;
  position: relative;
  z-index: 2;
}

/* INPUTS */
textarea, input {
  width: 100%;
  margin-top: 10px;
  background: rgba(22,22,29,0.85);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(123,44,191,0.2);
}

.output-box {
  margin-top: 10px;
  background: rgba(22,22,29,0.85);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  min-height: 90px;
  white-space: pre-wrap;
}

/* CURSOR */
.cursor-dot {
  position: fixed;
  width: 8px;
  height: 8px;
  background: #b5b5b5;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
}

.cursor-ring {
  position: fixed;
  width: 28px;
  height: 28px;
  border: 2px solid rgba(180,180,180,0.6);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
}

/* PARTICLES */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  background: #000;
  animation: disperse 900ms ease-out forwards;
}

@keyframes disperse {
  0% { transform: translate(0,0) scale(1); opacity:1; }
  100% { transform: translate(var(--x), var(--y)) scale(0.2); opacity:0; }
}

.circle { border-radius: 50%; }
.square { border-radius: 2px; }
.sketch { border: 2px solid #000; background: transparent; }

</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="noise"></div>
<div class="spotlight" id="spot"></div>

<!-- CURSOR -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <div class="sidebar-tab" onclick="toggleSidebar()">
    ☰
  </div>

  <div class="sidebar-tools">
    <button onclick="setTool('extract')">URL Extract</button>
    <button onclick="setTool('b64enc')">Base64 Encode</button>
    <button onclick="setTool('b64dec')">Base64 Decode</button>
    <button onclick="setTool('count')">Counter</button>
    <button onclick="setTool('json')">JSON</button>
    <button onclick="setTool('html')">HTML</button>
    <button onclick="setTool('uuid')">UUID</button>
    <button onclick="setTool('reverse')">Reverse</button>
    <button onclick="setTool('caesar')">Caesar Cipher</button>
  </div>

</div>

<!-- MAIN -->
<div class="container">

  <textarea id="input"></textarea>

  <input id="shift" type="number" placeholder="Caesar shift (0-25)"/>

  <div class="output-box" id="output"></div>

  <button onclick="runTool()">Run</button>

</div>

<script>

let tool = "extract";

function setTool(t) {
  tool = t;
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

/* CAESAR */
function caesar(str, shift) {
  shift %= 26;
  return str.replace(/[a-z]/gi, c => {
    const base = c >= 'a' ? 97 : 65;
    return String.fromCharCode((c.charCodeAt(0)-base+shift+26)%26+base);
  });
}

function runTool() {
  const input = document.getElementById("input").value;
  const shift = parseInt(document.getElementById("shift").value || 0);
  let out = "";

  if (tool === "caesar") out = caesar(input, shift);

  if (tool === "extract") {
    const links = input.match(/https?:\/\/[^\s]+/g) || [];
    out = links.length ? links.join("\n") : "No links found.";
  }

  if (tool === "b64enc") out = btoa(input || "");

  if (tool === "b64dec") {
    try { out = atob(input); }
    catch { out = "Invalid Base64"; }
  }

  if (tool === "count") {
    const words = input.trim() ? input.trim().split(/\s+/).length : 0;
    out = `Characters: ${input.length}\nWords: ${words}`;
  }

  if (tool === "json") {
    try { out = JSON.stringify(JSON.parse(input), null, 2); }
    catch { out = "Invalid JSON"; }
  }

  if (tool === "html") {
    const w = window.open();
    w.document.write(input);
    return;
  }

  if (tool === "uuid") out = crypto.randomUUID();

  if (tool === "reverse") {
    out = input.split(/\s+/).reverse().join(" ");
  }

  document.getElementById("output").textContent = out;
}

/* CURSOR */
const dot = document.getElementById("cursorDot");
const ring = document.getElementById("cursorRing");

let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener("mousemove", e => {
  mx = e.clientX;
  my = e.clientY;
  dot.style.left = mx + "px";
  dot.style.top = my + "px";
});

function animateCursor() {
  rx += (mx - rx) * 0.15;
  ry += (my - ry) * 0.15;
  ring.style.left = rx + "px";
  ring.style.top = ry + "px";
  requestAnimationFrame(animateCursor);
}
animateCursor();

/* spotlight */
const spot = document.getElementById("spot");
let smx = 0, smy = 0;

document.addEventListener("mousemove", e => {
  smx = e.clientX;
  smy = e.clientY;
});

function animate() {
  const dx = smx - spot.offsetLeft;
  const dy = smy - spot.offsetTop;

  spot.style.left = spot.offsetLeft + dx * 0.12 + "px";
  spot.style.top = spot.offsetTop + dy * 0.12 + "px";

  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
